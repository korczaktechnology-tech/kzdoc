name: Fase 9 - Organização

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-organization:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Testes unitários
        working-directory: backend
        run: pytest -m "not integration"
      - name: Fluxos de organização com MongoDB
        working-directory: backend
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017
          MONGODB_DATABASE: KZDocs
        run: pytest tests/test_api_integration.py -m integration

  frontend-organization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar frontend
        working-directory: frontend
        run: npm install
      - name: Build TypeScript e Vite
        working-directory: frontend
        run: npm run build
      - name: Testes do frontend
        working-directory: frontend
        run: npm test -- --run
