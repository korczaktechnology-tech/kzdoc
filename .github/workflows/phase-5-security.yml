name: Fase 5 - Seguranca

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Varredura de credenciais atual e histórica
        run: bash scripts/security-secret-scan.sh
      - name: Testes unitários de segurança
        working-directory: backend
        run: pytest tests/test_security.py -m "not integration"
        env:
          MONGODB_DATABASE: KZDocs
      - name: Testes de segurança com MongoDB
        working-directory: backend
        run: pytest tests/test_security.py -m integration
        env:
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DATABASE: KZDocs
      - name: Contrato e regressão da API
        working-directory: backend
        run: pytest -m "not integration"
        env:
          MONGODB_DATABASE: KZDocs
