name: Fase 13 - Integração Frontend Backend
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  integracao:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pytest -q tests/test_api_contract.py tests/test_api_integration.py tests/test_audit.py
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017
          MONGODB_DATABASE: KZDocs
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend
        working-directory: frontend
        run: |
          npm install
          npm test -- --run
          npm run build
