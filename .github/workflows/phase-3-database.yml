name: Fase 3 - Banco de Dados

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Validar banco e testes
        working-directory: backend
        run: pytest
        env:
          MONGODB_DATABASE: KZDocs

  mongodb-integration:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Instalar ferramentas MongoDB
        run: |
          curl -fsSL https://www.mongodb.org/static/pgp/server-8.0.asc | sudo gpg --dearmor -o /usr/share/keyrings/mongodb-server-8.0.gpg
          echo "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg ] https://repo.mongodb.org/apt/ubuntu noble/mongodb-org/8.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-8.0.list
          sudo apt-get update
          sudo apt-get install -y mongodb-database-tools
      - name: Testar conexão, bootstrap, índices e recuperação
        working-directory: backend
        run: pytest -m integration
        env:
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DATABASE: KZDocs

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar frontend
        working-directory: frontend
        run: npm install
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Testar frontend
        working-directory: frontend
        run: npm test -- --run
