name: Fase 3 - Banco de Dados

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Validar banco e testes
        working-directory: backend
        run: pytest
        env:
          MONGODB_DATABASE: KZDocs

  mongodb-integration:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Instalar MongoDB Database Tools
        run: |
          curl -fsSL https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2404-x86_64-100.12.2.tgz -o /tmp/mongodb-tools.tgz
          tar -xzf /tmp/mongodb-tools.tgz -C /tmp
          sudo install /tmp/mongodb-database-tools-ubuntu2404-x86_64-100.12.2/bin/mongodump /usr/local/bin/mongodump
          sudo install /tmp/mongodb-database-tools-ubuntu2404-x86_64-100.12.2/bin/mongorestore /usr/local/bin/mongorestore
      - name: Testar conexão, bootstrap, índices e recuperação real
        working-directory: backend
        run: pytest tests/test_database_integration.py -m integration
        env:
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DATABASE: KZDocs

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar frontend
        working-directory: frontend
        run: npm install
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Testar frontend
        working-directory: frontend
        run: npm test -- --run
