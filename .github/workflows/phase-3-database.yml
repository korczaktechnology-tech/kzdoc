name: Fase 3 - Banco de Dados

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Validar banco e testes
        working-directory: backend
        run: pytest
        env:
          MONGODB_DATABASE: KZDocs

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar frontend
        working-directory: frontend
        run: npm install
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Testar frontend
        working-directory: frontend
        run: npm test -- --run
