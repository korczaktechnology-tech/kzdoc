name: Fase 11 - Usuarios Grupos Permissoes
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  phase-11:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend
        working-directory: backend
        run: |
          pip install -e ".[test]"
          pytest -q tests/test_api_contract.py tests/test_api_integration.py tests/test_security.py
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017
          MONGODB_DB: KZDocs
      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm test -- --run
