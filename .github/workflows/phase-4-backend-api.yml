name: Fase 4 - Backend API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Testes unitários e contrato
        working-directory: backend
        run: pytest -m "not integration"
        env:
          MONGODB_DATABASE: KZDocs
      - name: Teste de integração da API
        working-directory: backend
        run: pytest -m integration
        env:
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DATABASE: KZDocs

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar frontend
        working-directory: frontend
        run: npm install
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Testes
        working-directory: frontend
        run: npm test -- --run
