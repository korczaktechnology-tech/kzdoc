name: Fase 12 - Auditoria e Histórico
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  auditoria:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: pytest -q tests/test_api_contract.py tests/test_api_integration.py tests/test_audit.py
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017
          MONGODB_DATABASE: KZDocs
      - name: Frontend
        working-directory: frontend
        run: |
          npm install
          npm run build
          npm test -- --run
